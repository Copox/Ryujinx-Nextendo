name: Account storage regression
on:
  pull_request:
    paths:
      - 'src/Ryujinx.Common/**'
      - 'tests/nextendo-account-security/**'
      - 'assets/Locales/**'
      - 'assets/Languages.json'
      - 'Directory.*'
      - 'global.json'
      - '.github/workflows/account-storage.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  account-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore account regression dependencies
        run: dotnet restore tests/nextendo-account-security/Ryujinx.AccountSecurity.Tests.csproj --source https://api.nuget.org/v3/index.json
      - name: Exercise account persistence and migration
        run: dotnet test tests/nextendo-account-security/Ryujinx.AccountSecurity.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=account-storage.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-storage-results-${{ matrix.os }}
          path: tests/nextendo-account-security/TestResults/*.trx
